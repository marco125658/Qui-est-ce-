<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Choisis ton univers — Qui est ce ?</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page page--game">
        <h1 class="page-title">CHOISIS TON UNIVERS</h1>

        <main class="universe-grid">
            <button type="button" class="universe-card universe-card--red" data-universe="himym">
                <span class="universe-card__title">HOW I MET<br>YOUR MOTHER</span>
            </button>
            <button type="button" class="universe-card universe-card--blue" data-universe="crazyGame">
                <span class="universe-card__title">LE CRAZY<br>GAME</span>
            </button>
        </main>

        <a href="index.html" class="btn btn--ghost btn--back">&larr; RETOUR</a>
    </div>

    <!-- Pop-up d'anniversaire temporaire (voir js/anniversaire.js) -->
    <div id="birthday-popup" class="popup" role="dialog" aria-modal="true" aria-labelledby="birthday-title">
        <div class="popup__box">
            <p id="birthday-title" class="birthday-banner">BON ANNIVERSAIRE<br>GROSSE FOLLE</p>
            <img class="birthday-photo" src="assets/anniversaire/photo.jpg" alt="Affiche Bodyguard : Ne la quitte jamais des yeux">
        </div>
    </div>

    <audio id="birthday-audio" src="assets/anniversaire/musique-depart10s.mp3" preload="auto"></audio>

    <script src="js/data.js" defer></script>
    <script src="js/game.js" defer></script>
    <script src="js/confetti.js" defer></script>
    <script src="js/anniversaire.js" defer></script>
</body>
</html>
